<div class="app-root">
  <header class="app-header">
    <div class="app-brand">
      <span class="app-logo">&#9650;</span>
      <span class="app-title">MarketDash</span>
    </div>

    <div class="app-header-center">
      <app-search-bar />
    </div>

    <div class="app-header-right">
      <div class="ws-indicator" [class.connected]="wsConnected()" title="WebSocket status">
        <span class="ws-dot"></span>
        <span class="ws-label">{{ wsConnected() ? 'Live' : 'Offline' }}</span>
      </div>

      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
      >
        {{ theme() === 'dark' ? '&#9788;' : '&#9790;' }}
      </button>
    </div>
  </header>

  <main class="app-grid">
    <section class="panel panel-watchlist">
      <app-watchlist />
    </section>

    <section class="panel panel-chart">
      <app-candlestick-chart [symbol]="selectedSymbol()" />
    </section>

    <section class="panel panel-metrics">
      <app-metrics-strip />
    </section>

    <section class="panel panel-portfolio">
      <app-portfolio />
    </section>
  </main>
</div>
